plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sugyeong'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    // API 명세서: /swagger-ui.html, /v3/api-docs (springdoc 3.x = Spring Boot 4)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 소스 인코딩은 JVM 기본값(Windows 는 MS949 일 수 있음)에 기대지 않는다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 프론트(frontend/, Vite + React)를 빌드해 jar 의 static/ 으로 넣는다. -PskipFrontend 면 건너뛴다.
def npmCmd = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

def npmInstall = tasks.register('npmInstall', Exec) {
    workingDir 'frontend'
    commandLine npmCmd, 'ci'
    inputs.files('frontend/package.json', 'frontend/package-lock.json')
    outputs.dir('frontend/node_modules')
}

def frontendBuild = tasks.register('frontendBuild', Exec) {
    dependsOn npmInstall
    workingDir 'frontend'
    commandLine npmCmd, 'run', 'build'
    inputs.dir('frontend/src')
    inputs.dir('frontend/public')
    inputs.files('frontend/index.html', 'frontend/vite.config.js', 'frontend/package-lock.json')
    outputs.dir('frontend/dist')
}

// 프론트는 배포용 jar 에만 넣는다. bootRun·IntelliJ 실행·테스트는 API 만 뜨고, 화면은 Vite(5173)에서 본다.
tasks.named('bootJar') {
    if (!project.hasProperty('skipFrontend')) {
        dependsOn frontendBuild
        from('frontend/dist') { into 'BOOT-INF/classes/static' }
    }
}
